<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>~/notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">~/articles</div>
    
      <div class="sidebar-controls">
        <input id="search" type="text" placeholder="grep..." autocomplete="off" spellcheck="false">
        <div id="tag-filter" class="tag-filter"></div>
      </div>
    
      <nav id="article-list"></nav>
    
      <div class="sidebar-footer">
        <span class="prompt">$</span> <span class="blink">_</span>
      </div>
    </aside>
    <main class="content">
      <div class="content-header" id="content-header">~/notes $ _</div>
      <article id="article" class="markdown-body">
        <p class="loading">Загрузка...</p>
      </article>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
